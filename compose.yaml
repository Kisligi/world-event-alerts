# Local infrastructure for World Event Alerts.
# M1: PostgreSQL only. Later milestones add the app, Mailpit and the Slack stand-in,
# so that `docker compose up --build` starts everything.
#
# The credentials below are demo values for a throwaway local database, not secrets.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: alerts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerts -d alerts"]
      interval: 5s
      timeout: 3s
      retries: 10
