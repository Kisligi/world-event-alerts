# World Event Alerts - application configuration.
# All values are demo defaults for a local, self-contained setup. Nothing here is a secret:
# the database credentials only work for the throwaway local PostgreSQL container.
spring:
  application:
    name: world-event-alerts
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alerts}
    username: ${DB_USER:alerts}
    password: ${DB_PASSWORD:alerts}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # Outgoing mail. Defaults point to Mailpit (local test SMTP server, web inbox on port 8025).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Event sources (docs/decisions.md ADR-003). Defaults: simulator on, real USGS feed off.
alerts:
  sources:
    polling-enabled: ${ALERTS_POLLING_ENABLED:true}
    simulator:
      enabled: ${ALERTS_SIMULATOR_ENABLED:true}
      interval: ${ALERTS_SIMULATOR_INTERVAL:30s}
    usgs:
      enabled: ${ALERTS_USGS_ENABLED:false}
      interval: ${ALERTS_USGS_INTERVAL:5m}
      feed-url: ${ALERTS_USGS_FEED_URL:https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson}
  channels:
    email:
      from: ${ALERTS_EMAIL_FROM:World Event Alerts <alerts@example.com>}
  # Retries per delivery (docs/decisions.md ADR-007): 3 attempts, waiting 1s then 2s.
  delivery:
    max-attempts: ${ALERTS_DELIVERY_MAX_ATTEMPTS:3}
    initial-backoff: ${ALERTS_DELIVERY_INITIAL_BACKOFF:1s}
    multiplier: 2
